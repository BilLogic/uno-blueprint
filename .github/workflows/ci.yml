# The checks that make this package's claims true rather than asserted.
#
# Every guard in here already existed as a script somebody could remember to
# run. A guard nobody runs is not a guard, so they run on every pull request.
#
# `pull_request`, never `pull_request_target`. That distinction is the whole
# security story for a public repo: a `pull_request` run from a fork gets a
# read-only token and no secrets, and it checks out the fork's code — which
# is untrusted, and is treated as such. `pull_request_target` runs in the
# BASE repo's context with secrets available; combined with checking out the
# PR head, it hands an attacker code execution with this repo's token.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top level. A job that genuinely needs more has to
# raise it for itself, so the diff shows the escalation.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # THE TAGS, BEFORE ANYTHING READS THEM. A checkout does not fetch tags,
      # and the tag is the only thing a consumer can pin — so a runner without
      # them is a runner where every claim about tags is vacuously true. This
      # sat beside `check:release-tag` two dozen steps below, which left `npm
      # test` running against an empty tag list: the suite's breadth assertion
      # over that subject went red, correctly, and the check itself would have
      # announced that it held nothing. Both of those stay as the backstop; the
      # fetch moving up here is what makes them unnecessary.
      - run: git fetch --tags --force
      # The plugin contract's identifier layer, and the one version number.
      - run: npm run check:manifest
      - run: npm run check:version
      # The two v1 adapters carry the same fields, and the IR round-trip
      # suite — which until now existed as a script nobody ran.
      - run: npm run check:parity
      - run: npm run check:portable-core
      # The instance's rename map, read from GitHub, against the schema the
      # portable core builds: a name the instance retired that is still live
      # here fails the build instead of waiting to be noticed (#101).
      - run: npm run check:instance-vocabulary
      # Upstream migrations are allocated from the reserved band, never stamped
      # with the wall clock — see docs/connectors/supabase/database.md.
      - run: npm run check:band
      - run: npm run test:ir
      # The vendored rulebook against its source, then the suite.
      - run: npm test
      - run: npm run lint
      - run: npm run build
      # The agent harness's keyless rehearsal: the loop's gates and the
      # sample reads through the bundled app surface, no provider involved.
      - run: npm run agent:harness:smoke
      # The cell-edit-with-revert slice: the real panel edits a cell, the real
      # save and ledger land and revert it, and the row reads back as it was,
      # over an in-memory table. Also part of `npm test`; named here so a red
      # run says which flow broke.
      - run: npm run slice:cell-edit
      # The agent-session slice: a person opens the real agent panel, sends a
      # message, and the real loop — driven by the scripted provider #694
      # introduced, no network and no key — runs a read tool and then a write
      # tool. The panel renders the turn and each call's result, the write
      # lands on the ledger with the session's attribution and is reverted
      # from the real change sheet, and the transcript survives a close and
      # reopen. Same in-memory table as the step above. Also part of
      # `npm test`; named here so a red run says which flow broke.
      - run: npm run slice:agent-session
      # The annotation-drag slice: the real toolbar opens annotation mode, the
      # real layer draws a box across two cells of a board and drags it onto a
      # third, and the real capture menu reads the marks back at the cells they
      # cover. Its second case drops the drag's position write and requires the
      # read-back to go red. Also part of `npm test`; named here for the same
      # reason the one above is.
      - run: npm run slice:annotation-drag
      # The phone agent-jump slice: the real phone shell, at phone width, from
      # the cover through to an agent-driven camera move — the sheet stays up
      # across the jump, the height it occludes reaches the camera as a fit
      # inset, the selection comes back in the words the navigation tool
      # verifies against, and the caret returns to the composer once the
      # camera settles. Its two reds restore the defects that shipped on this
      # surface — the sheet closing on a jump, and the shell dropping its
      # phase line — and require the flow to go red for each. Also part of
      # `npm test`; named here for the same reason the three above are.
      - run: npm run slice:phone-agent-jump
      # The write tools post their
      # arguments BY NAME, and PostgREST resolves an RPC by matching those
      # names to a function's parameters. A key the function does not have is
      # a 404 at the seam, and #168 shipped one for a release — the panel could
      # not save an arrow at all. Static, reads the committed schema dump.
      - run: npm run check:rpc-arguments
      # The standalone claim: no tracked file names the deployment this template
      # was generalised from.
      - run: npm run check:standalone
      # The other half of the same claim. The sweep above reads NAMES; a cell
      # id copied out of that deployment's database names nothing, and neither
      # does its cast or one of its scenarios. Content with the name filed off
      # walked straight past the grep until #329.
      - run: npm run check:content-coupling
      # The namespace seam, measured rather than stated. Every key the app
      # stores is prefixed per INSTALLATION, so two installations on one origin
      # do not read each other's settings and sessions — and one key was a bare
      # literal, which nothing could see because a literal key works for the
      # module that writes it. The account is the script's header.
      - run: npm run check:storage-keys
      # `--require` is not passed here: the tag for a version is cut after the
      # release commit is on main, not on the pull request that proposes it
      # (docs/engineering/releasing.md). The fetch that makes the tags visible
      # is a precondition of the whole job and runs above, beside `npm ci`.
      - run: npm run check:release-tag
      # The two indexes are generated from the docs' own frontmatter, and a
      # doc that states no summary fails here rather than landing as a blank
      # row in the map an agent routes by.
      - run: npm run check:docs-index
      # The canvas agent writes the enum values its rulebook states, and
      # those had drifted — docs/engineering/checks.md.
      - run: npm run check:dependency-kinds
      # Every assembled file is documented by exactly one composition
      # document. The claim for a file is written where the file lives, so a
      # module added here is claimed here — a deployment that pins the release
      # writes nothing, and a surface nobody documented is red in the
      # repository that added it.
      - run: npm run check:harness
      # Every repository path the
      # plugin surface NAMES still exists. An installed skill opens the paths
      # its documents write down, so a rename that never looked at the prose
      # hands the agent a dead end mid-run.
      - run: npm run check:doc-paths

      # The same assertion pointed outward: every path a DEPLOYMENT imports
      # from this repo by fixed name still exists here. Those paths are a
      # published interface (docs/adr/0004-reference-paths-are-a-published-
      # interface.md), so a move fails this build rather than the consumer's,
      # one pinned tag later.
      - run: npm run check:reference-paths

      # Same reasoning, pointed at the database vocabulary instead of the file
      # tree: a relation named in a string literal is a path the type checker
      # cannot see, so a rename that TypeScript accepted still reaches Postgres
      # as a request for a table that is not there.
      - run: npm run check:database-names

      # The same class one directory over. `agents/auditor.md` pins a findings
      # row shape a model is told to produce, and it said `check_name` and
      # `note` for two renames after the columns became `check_key` and
      # `summary` — a document no compiler reads and, until now, no check did
      # either (#290).
      - run: npm run check:pinned-shapes

      # The router's three checks (#139). `AGENTS.md` is the whole always-loaded
      # tier — the one file every session is handed before it decides anything,
      # here and in a workspace scaffolded from here — so the properties that
      # keep it a router are held rather than left to a reviewer: it stays under
      # a stated char budget that ratchets DOWN as well as up, its prohibition
      # count only falls, and every pointer in it resolves, leads with its
      # trigger word and carries a document at all.
      #
      # They are cheap and static — three file reads, no database, no network —
      # so they sit in this job beside the other vocabulary and path guards
      # rather than in the Postgres one.
      - run: npm run check:budget
      - run: npm run check:negation
      - run: npm run check:pointers

      # The glossary's own check (#137). `CONTEXT.md` is the first pointer the
      # router fires, so a session that reads `AGENTS.md` reads this next — and
      # it was two thirds reference material: a rename map, an interface-to-schema
      # map and a section of reasoning about which words a sweep should skip,
      # paid for by every session that opened the file to look up one word. All
      # three are gone, to the checks that enforce them and to a generated
      # document under references/. This is what stops the file growing them
      # back: headings, prose and `**term** — definition` rows, with a failure
      # for a code fence, for a table naming a column, and for a section that
      # defines no term.
      - run: npm run check:glossary

      # The other half of that move: the interface-to-schema map is a disclosed
      # reference now, and its two tables are RENDERED from
      # scripts/interface-schema-map.mjs and the portable core's schema dump.
      # A generated document rots without a guard, so this fails when the
      # document is not what its sources render.
      - run: npm run check:interface-map

      # The files a host reads before any of this code runs, and the only
      # rules in the repository nothing else can see: a build does not read
      # them, a test does not serve them, and a page load only shows what they
      # did months later, as a browser error naming an import site rather than
      # the missing chunk. Two of the claims are the ones a diff reads as
      # correct either way — the ORDER, a 404 for a hashed chunk the deploy no
      # longer ships ABOVE the single-page fallback that would otherwise answer
      # it with the app shell, and the absence of FORCING, without which that
      # same 404 answers for every asset the site has. The third is the cache,
      # which the content hash makes safe for /assets/* and for nothing else.
      - run: npm run check:hosting

  # The application, opened in a browser.
  #
  # Every check in the job above reads a file, a schema or a module graph. None
  # of them renders anything, and docs/adr/0017-large-component-splits-wait-for
  # -an-end-to-end-round.md records what that costs: a renamed at-rule whose
  # whole block the browser dropped, and a lane chip that set `backgroundColor`
  # to a role key rather than a colour. Both shipped past a green build.
  #
  # So this job builds the distribution, previews it with no database
  # configured — the bundled sample board — and walks every phase, every
  # scenario, every path and both layouts, failing on any console error. It is
  # its own job because it is the only one that needs a browser, and a job that
  # installs Chromium should not be in the way of a check that reads a file.
  render-walk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The browser, cached on the version that decides where it is looked for.
      # Playwright resolves its browsers by a build number tied to the package
      # version, so a key on the runner's OS alone would serve a Chromium the
      # installed Playwright will not use, and the install step below would
      # download another one on every run. The version is read from the lock
      # file rather than from package.json: the lock is what `npm ci` installed.
      - name: The Playwright version this lock file installs
        run: |
          echo "PLAYWRIGHT_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" \
            >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      # Chromium only — one engine, because this walk is about whether the app
      # renders at all, not about engine differences. `--with-deps` is the
      # system libraries the runner lacks, and it runs apt on every run: the
      # cache saves the browser DOWNLOAD, not the dependency install.
      - run: npx playwright install --with-deps chromium

      # NO DATABASE. `isSupabaseConfigured()` reads VITE_SUPABASE_URL at BUILD
      # time and Vite bakes the value into dist, so the mode the walk runs in
      # is decided here and nowhere else. Empty, explicitly, rather than merely
      # unset: this states the intent where a reader can see it, and it is the
      # same line a deployment copies.
      - name: Build the distribution in no-database mode
        run: npm run build
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''

      # The guard, watched failing, BEFORE it is trusted. A walk that reports
      # no console errors looks identical whether the app is clean or the
      # listener was never wired up — so one error is injected into every page
      # and a zero exit is the failure.
      - name: A console error fails the walk
        run: |
          set -euo pipefail
          if RENDER_WALK_INJECT_CONSOLE_ERROR=1 npm run check:render-walk; then
            echo "FAIL: an injected console error did not fail the walk" >&2
            exit 1
          fi
          echo "ok: the walk refused a page that logged an error"

      # Four cases under one config: the walk over every view, the phone
      # cover walk, and the two browser halves of jsdom slices.
      # `render-walk/annotation-drag.spec.ts` draws a box across two cells
      # with real mouse moves, drags it onto a third under a real pointer
      # capture, and reads the captured cell ids out of the capture menu's own
      # download — the three things that slice has to stub.
      # `render-walk/mobile-agent-jump.spec.ts` drives the phone's agent jump
      # at 375×812 with the provider endpoint answered from the spec, and
      # asserts the three its slice cannot claim from jsdom: the tool's
      # settled sentence on a real clock, a legible strip above the sheet, and
      # the destination visibly inside it.
      - name: Walk every view, drag an annotation, and jump the phone camera
        run: npm run check:render-walk

      # One screenshot per view, kept whichever way the walk went. The failures
      # this job CANNOT assert — a chip that lost its tint, a colour that is
      # wrong rather than absent — are read off these by a person, so they are
      # the deliverable of a green run as much as of a red one. `if: always()`
      # because a red walk is when they are read most, and it uploads whatever
      # the two runs left behind, the failing run's trace included.
      #
      # `warn` rather than `error`, because `if: always()` also runs this after
      # a failed BUILD, which leaves no output directory at all. `error` there
      # turns one real failure into two red steps and points the reader at the
      # upload rather than at the build that never produced anything to upload.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-walk-screenshots
          path: render-walk-output/**
          if-no-files-found: warn

      # The same walk over a build served from a path. A host may mount the
      # app under a prefix rather than at a domain root, and then every chunk,
      # font, public image and written address has to stay under it. The build
      # lands in `dist/demo/`, the preview serves it at `/demo/`, and the walk
      # navigates relative to that. `served-from-a-path.spec.ts` asserts the
      # prefix on the shareable address, a cold reload of it, and every
      # same-origin request; the rest of the walk catches a stored image path
      # that lost the prefix, because it 404s and the browser logs that as a
      # console error. After the upload above, so the root walk's screenshots
      # are the ones kept.
      - name: Build the distribution under /demo/
        run: npm run build
        env:
          BASE_PATH: /demo/
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
      # The rules that build wrote for the path. `BASE_PATH` alone is the
      # whole setting, so the build writes the prefixed redirects and the
      # hashed cache into dist/_redirects and dist/_headers; this reads them
      # back through the hosting check, strictly at /demo/. The preview below
      # reads neither file, so this is the step that sees them.
      - name: The build for /demo/ wrote the prefixed hosting rules
        run: npm run check:hosting -- --built
        env:
          BASE_PATH: /demo/
      - name: Walk the build served from /demo/
        run: npm run check:render-walk
        env:
          BASE_PATH: /demo/

  # The portability position, executed.
  #
  # The partition between the portable Postgres core and the Supabase recipe is
  # marked in the migrations and generated from those marks
  # (scripts/generate-portable-core.mjs). Generated artifacts rot without a
  # guard, and a claim nobody runs is a sentence, so this job does four things
  # in order, each of which can fail on its own:
  #
  #   1. regenerate both halves and diff them against what is committed;
  #   2. apply the CORE to a stock postgres:17 — no Supabase, no shim, nothing
  #      in front of it. This is the claim. Either the SQL is accepted or the
  #      build is red;
  #   3. apply the RECIPE on top of that same database, behind the shim that
  #      stands in for the Supabase primitives it names;
  #   4. break the core on purpose and check that steps 1 and 2 go red. A guard
  #      nobody has watched fail is a guard nobody knows the shape of.
  #
  # The full migration replay is kept as well, in its own database. It proves
  # something the two halves cannot: that the path an actual Supabase project
  # takes — every migration, in order — still lands where the halves land.
  portable-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The client has to match the service: `pg_dump` refuses a server newer
      # than itself, and ubuntu-latest's `postgresql-client` is 16 against the
      # postgres:17 container. The PGDG repository the runner already carries
      # has 17; its binaries go first on PATH so the pg_wrapper cannot pick 16.
      - name: Install the Postgres 17 client
        run: |
          # The runner's PGDG source is pinned to the 16 component, so the
          # full repository line goes in beside it.
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg-all.list > /dev/null
          sudo apt-get update && sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      # 1. The generated halves still describe the migrations.
      - name: Regenerate the partition and diff it against what is committed
        run: npm run check:portable-core

      # 2. The claim: this half runs on any Postgres.
      - name: Apply the portable core to a stock Postgres, with no shim
        run: |
          set -euo pipefail
          createdb portable_core
          psql -v ON_ERROR_STOP=1 -d portable_core \
            -f supabase/generated/portable-core.generated.sql

      # The dump of what that core builds, with only the names it holds them
      # under, is committed beside the series and read by the vocabulary
      # checks. It is regenerated here and diffed (#101).
      - name: The schema dump is what the series builds
        run: npm run check:portable-schema

      # 3. The recipe is one conformant way to enforce the contract on top.
      - name: Apply the Supabase recipe on top of the core
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d portable_core \
            -f supabase/portable/supabase-shim.sql
          psql -v ON_ERROR_STOP=1 -d portable_core \
            -f supabase/generated/supabase-recipe.generated.sql

      # The types are generated from this stack, whole — body and the derived
      # tail of enum unions — so a migration that changes a shape the committed
      # file does not carry, or a hand edit to that file, fails here. The
      # generator stands up a database of its own from the same two halves.
      - name: The app's types are what the built database generates
        run: npm run check:database-types

      - name: The app's types describe the database the two halves built
        run: |
          set -euo pipefail
          psql -At -F $'\t' -d portable_core -f supabase/portable/inventory.sql \
            > /tmp/inventory.tsv
          node scripts/check-schema-inventory.mjs /tmp/inventory.tsv

      # The deployer's path, on a database of its own. The two proofs above read
      # as the owner; this one reads as the anon key the deployed app carries, so
      # a table the recipe forgot to expose — a blank screen in the browser —
      # fails here instead of shipping. check-seed-loads.mjs stands up its own
      # fresh database (shim, the platform's SELECT default, core, recipe, seed)
      # and tears it down; the postgres:17 service and PG* env above are all it
      # needs. See docs/engineering/checks.md § The database.
      - name: The generated seed loads on a fresh core and renders as anon
        run: npm run check:seed-load

      # The cell-edit slice's PRIMARY form (#734). `npm run slice:cell-edit`
      # in the check job drives the flow over an in-memory table, which cannot
      # see a grant or a policy. This runs the same file over standalone
      # PostgREST on a scratch database the runner builds from the same stack
      # the step above applied — through supabase-js, as
      # a signed-in author carrying the service claim the recipe's restrictive
      # policies ask for — so a grant the recipe forgot on a column the panel
      # writes fails the slice, not only the seed-load check. `--prove`
      # revokes one such grant and requires the slice to go red, then puts it
      # back. The binary is a pinned release, checked against its published
      # digest, and cached: PostgREST is not an npm package.
      - name: Cache the PostgREST release
        id: postgrest
        uses: actions/cache@v4
        with:
          path: ~/.cache/postgrest
          key: postgrest-v16.3-linux-static-x86-64
      - name: Fetch PostgREST
        if: steps.postgrest.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/postgrest
          curl -fsSL -o /tmp/postgrest.tar.xz \
            https://github.com/PostgREST/postgrest/releases/download/v16.3/postgrest-v16.3-linux-static-x86-64.tar.xz
          echo "4eb414eb948c8800863cc8c9896a17b611b2dccf9ff581f4d57f42ec9ccee40d  /tmp/postgrest.tar.xz" | sha256sum -c -
          tar -xJf /tmp/postgrest.tar.xz -C ~/.cache/postgrest
          chmod +x ~/.cache/postgrest/postgrest
      - name: The cell-edit slice runs over PostgREST, and goes red when a grant is revoked
        run: POSTGREST_BIN="$HOME/.cache/postgrest/postgrest" npm run slice:cell-edit:postgrest

      # The one class of defect a dump cannot show and a catalogue sweep only
      # sees when the word is already retired: a `language sql` body naming a
      # relation a later rename moved. The body is text, resolved at call time,
      # so the function exists, dumps cleanly and raises 42P01 on the first
      # call — which is #171, where every structural delete was broken for four
      # migrations. The self-test runs first, for the reason the vocabulary
      # sweep's does: a run where every function answered looks identical to a
      # run that called none of them.
      - name: A sql function body that does not resolve fails, then none do
        run: |
          set -euo pipefail
          npm run check:function-bodies -- --self-test
          npm run check:function-bodies

      # The route a real Supabase project takes, in its own database.
      - name: Replay every migration in order, behind the shim
        run: |
          set -euo pipefail
          createdb migration_replay
          psql -v ON_ERROR_STOP=1 -d migration_replay \
            -f supabase/portable/supabase-shim.sql
          for file in supabase/migrations/*.sql; do
            echo "--- $file"
            psql -v ON_ERROR_STOP=1 -d migration_replay -f "$file"
          done

      - name: The replay and the two halves agree
        run: |
          set -euo pipefail
          psql -At -F $'\t' -d migration_replay -f supabase/portable/inventory.sql \
            > /tmp/replay.tsv
          diff -u /tmp/inventory.tsv /tmp/replay.tsv

      - name: A populated resource split preserves citation targets
        run: bash scripts/tests/resource-split-migration.test.sh

      # An empty replay cannot tell a guard that refuses from a migration that
      # did nothing. This one populates `evidence` with the three shapes the
      # deployment holds and asserts which of them stop the file.
      - name: A populated evidence fold keeps its prose and refuses a reference
        run: bash scripts/tests/evidence-note-migration.test.sh

      # `services.entity_examples` is written from the editor as well as by the
      # seed, so the emitter alone cannot say whether an authored example
      # arrives and whether the next re-map takes it away again. This loads a
      # generated seed and reads the row back.
      - name: An authored example survives a re-map
        run: bash scripts/tests/entity-examples-round-trip.test.sh

      # The vocabulary sweep, against the catalogue rather than the files.
      # `alter table … rename` moves the table and the column; the index, the
      # constraint, the policy, the trigger, the comment and every plpgsql body
      # keep the name they were created with. Only a built database can say
      # which of those still carry a retired word, and `migration_replay` is one.
      #
      # The self-test runs FIRST, and for the same reason `A broken core fails
      # this job` exists below: a sweep that returns nothing looks identical
      # whether the schema is clean or the query is broken. It plants an object
      # named for a retired word inside a transaction, asserts the sweep reports
      # it, and rolls back.
      - name: The vocabulary sweep can fail, then does not
        run: |
          set -euo pipefail
          npm run check:identifiers -- --self-test --database migration_replay
          npm run check:identifiers -- --database migration_replay

      # 4. The guard, watched failing. Both halves of it: a generated file that
      # no longer matches its migrations, and a core that a stock Postgres
      # refuses. Neither is allowed to pass.
      - name: A broken core fails this job
        run: |
          set -euo pipefail
          cp supabase/generated/portable-core.generated.sql /tmp/core.bak

          echo "-- a hand edit, which is the thing the diff exists to catch" \
            >> supabase/generated/portable-core.generated.sql
          if npm run check:portable-core; then
            echo "FAIL: a hand-edited generated file passed the diff" >&2
            exit 1
          fi
          echo "ok: the diff refused a hand-edited core"

          cp /tmp/core.bak supabase/generated/portable-core.generated.sql
          createdb broken_core
          {
            echo "create table public.deliberately_broken ("
            echo "  id uuid references public.a_table_that_does_not_exist (id)"
            echo ");"
            cat supabase/generated/portable-core.generated.sql
          } > /tmp/broken-core.sql
          if psql -v ON_ERROR_STOP=1 -d broken_core -f /tmp/broken-core.sql; then
            echo "FAIL: a broken core applied cleanly to Postgres" >&2
            exit 1
          fi
          echo "ok: Postgres refused a broken core, and ON_ERROR_STOP reported it"

  # The workspace, installed and built under each package manager that can
  # start one.
  #
  # `npm create`, `pnpm create`, `yarn create` and `bun create` all run the
  # same initialiser, and it installs with whichever of them called. So the
  # template has four ways to be installed and three of them are not the one
  # this repository uses: every other job here runs `npm ci` against the lock
  # file. What a strict store does to an import nobody declared, or what a
  # manager that reads no `package-lock.json` resolves instead, is invisible
  # to all of them.
  #
  # This job writes the workspace this commit would be — the initialiser, fed a
  # `git archive` of the checkout where a release's tarball would have been
  # (`from-working-tree.mjs`, beside the initialiser's own source) — lets the
  # initialiser install it with the manager under test, and builds it there. It
  # runs no `npm ci` of its own: the initialiser has no dependencies, which is
  # the other thing this would notice.
  #
  # WHAT IT PROVES IS INSTALL AND BUILD, under the version of each manager
  # pinned below, with `CI` set as the runner sets it — the unattended path,
  # in a workspace that has npm's lock file and none of the manager's own.
  # Three things it does not: that a manager is DETECTED, which is the unit
  # tests' claim, made against the user-agent strings the managers really
  # send (the one set below only selects the leg); that `<manager> create`
  # reaches the initialiser, which needs it published; and that `dev` serves.
  #
  # Not the suite either. A workspace is not a git checkout, and part of the
  # suite reads tags and the commit's file list out of git.
  #
  # Yarn is Yarn 1. The initialiser refuses to install under Yarn 2 or later,
  # which skips the `pre` scripts `dev` and `build` rely on.
  workspace:
    name: workspace installs and builds (${{ matrix.pm }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One manager going red says nothing about the other three.
      fail-fast: false
      matrix:
        # Exact versions, so a red leg is this commit's doing and not a
        # release of the manager that landed overnight. npm is the one that
        # ships with the Node this job sets up.
        include:
          - pm: npm
            agent: npm/10
          - pm: pnpm
            setup: npm install --global pnpm@12.8.1
            agent: pnpm/12.8.1
          - pm: yarn
            setup: npm install --global yarn@1.22.22
            agent: yarn/1.22.22
          - pm: bun
            setup: npm install --global bun@1.4.2
            agent: bun/1.4.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ${{ matrix.pm }}
        if: matrix.setup
        run: ${{ matrix.setup }}

      # The manager is named where it names itself when it runs the
      # initialiser: first in `npm_config_user_agent`. Set here rather than
      # by running the script through each manager, because the checkout is an
      # npm tree and three of them would have something to say about that.
      - name: Write a workspace from this commit and install it
        run: node packages/create-uno-blueprint/scripts/from-working-tree.mjs "$RUNNER_TEMP/workspace"
        env:
          npm_config_user_agent: ${{ matrix.agent }} npm/? node/v22 linux x64

      - name: Build it
        working-directory: ${{ runner.temp }}/workspace
        run: ${{ matrix.pm }} run build

      # A build with no figures still exits 0: they are copied in by the
      # script's `prebuild` hook, and a manager that skipped the hook would
      # ship a sample board whose storyboard frames are missing.
      - name: The build carries the page and the figures
        working-directory: ${{ runner.temp }}/workspace
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/cover/blueprint-anatomy.svg
