<svg viewBox="0 0 880 408" xmlns="http://www.w3.org/2000/svg" font-family="'Ubuntu Sans', system-ui, sans-serif">
  <style>
    .plate { fill: #f6f8f7; }
    .dot { fill: #151a18; fill-opacity: 0.17; }
    .card { fill: #ffffff; stroke: #151a18; stroke-opacity: 0.09; }
    .well { fill: #f6f8f7; stroke: #151a18; stroke-opacity: 0.09; }
    .well-focus { stroke: #00806a; stroke-opacity: 1; stroke-width: 1.5; }
    .title { font-size: 15px; font-weight: 600; fill: #151a18; }
    .label { font-size: 14.5px; fill: #565c5a; }
    .label-teal { font-size: 14.5px; font-weight: 600; fill: #00806a; }
    .strong { font-size: 14.5px; font-weight: 600; fill: #151a18; }
    .code { font-family: 'Ubuntu Sans Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14.5px; fill: #565c5a; }
    .code-strong { font-family: 'Ubuntu Sans Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14.5px; font-weight: 600; fill: #151a18; }
    .num { font-size: 14.5px; font-weight: 600; fill: #ffffff; }
    .axis { stroke: #151a18; stroke-opacity: 0.09; }
    .line { stroke: #565c5a; stroke-width: 1.25; }
    .flow { stroke: #565c5a; stroke-width: 1.5; fill: none; }
    .flow-head { fill: #565c5a; }
    .trace { stroke: #00806a; stroke-width: 1.5; fill: none; }
    .trace-head { fill: #00806a; }
    .zoom { stroke: #00806a; stroke-width: 1; stroke-opacity: 0.55; fill: none; }
    .skel { fill: #151a18; fill-opacity: 0.16; }
    .skel-teal { fill: #00806a; }
    .cell { stroke: #151a18; stroke-opacity: 0.09; }
    .cell-focus { stroke: #00806a; stroke-opacity: 1; stroke-width: 1.5; }
    .hit { fill: #00806a; }
    .tick { fill: #565c5a; }
    .miss { fill: #151a18; fill-opacity: 0.16; }
    .badge { fill: #00806a; stroke: #ffffff; stroke-width: 2; }
    .faded { opacity: 0.4; }
    .lane-c { fill: #e8f3ed; } .sq-c { fill: #cfe6d9; }
    .lane-f { fill: #fdf1e3; } .sq-f { fill: #f6e0bd; }
    .lane-b { fill: #fbe9f0; } .sq-b { fill: #f2cfdf; }
    .lane-s { fill: #ecebf5; } .sq-s { fill: #d9d6ec; }
  </style>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle class="dot" cx="10" cy="10" r="0.8"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="70%">
      <stop offset="0.35" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="fadeMask"><rect width="880" height="408" fill="url(#fade)"/></mask>
    <marker id="headMuted" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="flow-head" d="M0,0.5 L7,4 L0,7.5 Z"/></marker>
    <marker id="headTeal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="trace-head" d="M0,0.5 L7,4 L0,7.5 Z"/></marker>
  </defs>
  <rect class="plate" width="880" height="408" rx="16"/>
  <rect width="880" height="408" rx="16" fill="url(#grid)" mask="url(#fadeMask)"/>
  <rect class="card" x="24.5" y="24.5" width="831" height="383" rx="16"/>
  <text class="label" x="48" y="64">Lane</text>
  <text class="label" x="230" y="64" text-anchor="middle">Step 1</text>
  <text class="label" x="334" y="64" text-anchor="middle">Step 2</text>
  <text class="label" x="438" y="64" text-anchor="middle">Step 3</text>
  <text class="label" x="542" y="64" text-anchor="middle">Step 4</text>
  <rect class="sq-c" x="48" y="109" width="10" height="10" rx="3"/>
  <text class="strong" x="66" y="119">Customer</text>
  <rect class="lane-c cell" x="184.5" y="96.5" width="92" height="36" rx="8"/><rect class="skel" x="196.5" y="112" width="49" height="5" rx="2.5"/>
  <rect class="lane-c cell" x="288.5" y="96.5" width="92" height="36" rx="8"/><rect class="skel" x="300.5" y="112" width="39" height="5" rx="2.5"/>
  <rect class="lane-c cell" x="496.5" y="96.5" width="92" height="36" rx="8"/><rect class="skel" x="508.5" y="112" width="58" height="5" rx="2.5"/>
  <rect class="sq-f" x="48" y="169" width="10" height="10" rx="3"/>
  <text class="strong" x="66" y="179">Frontstage</text>
  <rect class="lane-f cell-focus" x="288.5" y="156.5" width="92" height="36" rx="8"/><rect class="skel-teal" x="300.5" y="172" width="45" height="5" rx="2.5"/>
  <rect class="lane-f cell" x="392.5" y="156.5" width="92" height="36" rx="8"/><rect class="skel" x="404.5" y="172" width="37" height="5" rx="2.5"/>
  <rect class="sq-b" x="48" y="229" width="10" height="10" rx="3"/>
  <text class="strong" x="66" y="239">Backstage</text>
  <rect class="lane-b cell" x="288.5" y="216.5" width="92" height="36" rx="8"/><rect class="skel" x="300.5" y="232" width="53" height="5" rx="2.5"/>
  <rect class="lane-b cell" x="392.5" y="216.5" width="92" height="36" rx="8"/><rect class="skel" x="404.5" y="232" width="41" height="5" rx="2.5"/>
  <rect class="lane-b cell" x="496.5" y="216.5" width="92" height="36" rx="8"/><rect class="skel" x="508.5" y="232" width="48" height="5" rx="2.5"/>
  <rect class="sq-s" x="48" y="289" width="10" height="10" rx="3"/>
  <text class="strong" x="66" y="299">Support</text>
  <rect class="lane-s cell" x="392.5" y="276.5" width="92" height="36" rx="8"/><rect class="skel" x="404.5" y="292" width="35" height="5" rx="2.5"/>
  <line class="line" x1="48" y1="144" x2="604" y2="144"/>
  <text class="label" x="620" y="149">Line of interaction</text>
  <line class="line" x1="48" y1="204" x2="604" y2="204"/>
  <text class="label" x="620" y="209">Line of visibility</text>
  <line class="line" x1="48" y1="264" x2="604" y2="264"/>
  <text class="label" x="620" y="269">Line of internal interaction</text>
  <path class="trace" d="M230,133 V168 Q230,174 236,174 H281" marker-end="url(#headTeal)"/>
  <path class="trace" d="M334,193 V209" marker-end="url(#headTeal)"/>
  <path class="flow" d="M381,234 H385" marker-end="url(#headMuted)"/>
  <path class="flow" d="M438,253 V269" marker-end="url(#headMuted)"/>
  <rect class="lane-f cell-focus" x="48.5" y="340.5" width="32" height="22" rx="8"/><rect class="skel-teal" x="56.5" y="349.5" width="14" height="4" rx="2"/>
  <text class="label" x="92" y="356">A cell: one lane at one step</text>
  <path class="trace" d="M372,351 H404" marker-end="url(#headTeal)"/>
  <text class="label" x="420" y="356">Leads to: one cell sets off the next</text>
</svg>
