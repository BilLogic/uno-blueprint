<svg viewBox="0 0 880 595" xmlns="http://www.w3.org/2000/svg" font-family="'Ubuntu Sans', system-ui, sans-serif">
  <style>
    .plate { fill: #0f1412; }
    .dot { fill: #ebf0ee; fill-opacity: 0.17; }
