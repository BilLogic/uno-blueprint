    .zoom { stroke: #3ecfb0; stroke-width: 1.25; stroke-opacity: 0.6; fill: none; }
    .skel { fill: #ebf0ee; fill-opacity: 0.22; }
    .cell { fill: none; stroke-width: 1.25; }
    .lane-c { stroke: #4cc38a; } .sq-c { fill: #4cc38a; }
