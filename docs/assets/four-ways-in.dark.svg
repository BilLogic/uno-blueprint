<svg viewBox="0 0 880 324" xmlns="http://www.w3.org/2000/svg" font-family="'Ubuntu Sans', system-ui, sans-serif">
  <style>
    .plate { fill: #0f1412; }
    .dot { fill: #ebf0ee; fill-opacity: 0.17; }
    .card { fill: #181d1b; stroke: #ebf0ee; stroke-opacity: 0.09; }
    .card-dash { fill: #181d1b; stroke: #ebf0ee; stroke-opacity: 0.34; stroke-dasharray: 4 4; }
    .card-focus { fill: #181d1b; stroke: #3ecfb0; stroke-width: 1.5; }
    .title { font-size: 15px; font-weight: 600; fill: #ebf0ee; }
    .label { font-size: 14.5px; fill: #a6acaa; }
    .label-teal { font-size: 14.5px; font-weight: 600; fill: #3ecfb0; }
    .strong { font-size: 14.5px; font-weight: 600; fill: #ebf0ee; }
    .flow { stroke: #a6acaa; stroke-width: 1.5; fill: none; }
    .flow-head { fill: #a6acaa; }
    .trace { stroke: #3ecfb0; stroke-width: 1.5; fill: none; }
    .trace-dash { stroke: #3ecfb0; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
    .trace-head { fill: #3ecfb0; }
    .skel { fill: #ebf0ee; fill-opacity: 0.22; }
    .skel-teal { fill: #3ecfb0; }
    .cell { stroke: #ebf0ee; stroke-opacity: 0.09; }
    .cell-dash { fill: none; stroke: #ebf0ee; stroke-opacity: 0.34; stroke-dasharray: 3 3; }
    .cell-focus { stroke: #3ecfb0; stroke-opacity: 1; stroke-width: 1.5; }
    .cell-focus-dash { stroke: #3ecfb0; stroke-opacity: 1; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .cell-stale { fill: #33260f; stroke: #fbbf6a; stroke-width: 1.25; }
    .skel-stale { fill: #fbbf6a; fill-opacity: 0.55; }
    .flag { fill: #3ecfb0; stroke: #181d1b; stroke-width: 2; }
    .faded { opacity: 0.4; }
    .rule { stroke: #ebf0ee; stroke-opacity: 0.09; }
    .tile { fill: #0f1412; stroke: #ebf0ee; stroke-opacity: 0.09; }
    .glyph { fill: none; stroke: #a6acaa; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .raised { fill: #181d1b; stroke: #ebf0ee; stroke-opacity: 0.17; }
    .tag { fill: #181d1b; stroke: #ebf0ee; stroke-opacity: 0.17; }
    .term { fill: #232a28; stroke: #ebf0ee; stroke-opacity: 0.17; }
    .term-key { font-family: 'Ubuntu Sans Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; font-weight: 500; fill: #7fe3cc; }
    .lane-c { fill: #16302a; } .sq-c { fill: #235043; }
    .lane-f { fill: #35290f; } .sq-f { fill: #5a451c; }
    .lane-b { fill: #371b27; } .sq-b { fill: #5a2d40; }
    .lane-s { fill: #24223d; } .sq-s { fill: #3b3866; }
