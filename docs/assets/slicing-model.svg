<svg viewBox="0 0 880 260" xmlns="http://www.w3.org/2000/svg" font-family="'Ubuntu Sans', system-ui, sans-serif">
  <style>
    .plate { fill: #f6f8f7; }
    .dot { fill: #151a18; fill-opacity: 0.17; }
    .card { fill: #ffffff; stroke: #151a18; stroke-opacity: 0.09; }
    .well { fill: #f6f8f7; stroke: #151a18; stroke-opacity: 0.09; }
    .well-focus { stroke: #00806a; stroke-opacity: 1; stroke-width: 1.5; }
    .title { font-size: 15px; font-weight: 600; fill: #151a18; }
    .label { font-size: 14.5px; fill: #565c5a; }
    .label-teal { font-size: 14.5px; font-weight: 600; fill: #00806a; }
    .strong { font-size: 14.5px; font-weight: 600; fill: #151a18; }
    .code { font-family: 'Ubuntu Sans Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14.5px; fill: #565c5a; }
    .code-strong { font-family: 'Ubuntu Sans Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14.5px; font-weight: 600; fill: #151a18; }
    .num { font-size: 14.5px; font-weight: 600; fill: #ffffff; }
    .axis { stroke: #151a18; stroke-opacity: 0.09; }
    .line { stroke: #565c5a; stroke-width: 1.25; }
    .flow { stroke: #565c5a; stroke-width: 1.5; fill: none; }
    .flow-head { fill: #565c5a; }
    .trace { stroke: #00806a; stroke-width: 1.5; fill: none; }
    .trace-head { fill: #00806a; }
    .zoom { stroke: #00806a; stroke-width: 1; stroke-opacity: 0.55; fill: none; }
    .skel { fill: #151a18; fill-opacity: 0.16; }
    .skel-teal { fill: #00806a; }
    .cell, .cell-focus, .cell-focus-dash { fill: none; stroke-width: 1.25; }
    .hit { fill: #00806a; }
    .tick { fill: #565c5a; }
    .miss { fill: #151a18; fill-opacity: 0.16; }
    .badge { fill: #00806a; stroke: #ffffff; stroke-width: 2; }
    .faded { opacity: 0.4; }
    .lane-c { stroke: #18794e; } .sq-c { fill: #18794e; }
    .lane-f { stroke: #cd1d8d; } .sq-f { fill: #cd1d8d; }
    .lane-b { stroke: #bd4b00; } .sq-b { fill: #bd4b00; }
    .lane-s { stroke: #ad5700; } .sq-s { fill: #ad5700; }
    .cell-focus, .cell-focus-dash { stroke: #00806a; stroke-width: 2; }
    .halo { fill: none; stroke: #00806a; stroke-opacity: 0.28; stroke-width: 3; }
  </style>
