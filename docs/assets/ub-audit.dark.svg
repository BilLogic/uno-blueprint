    <rect class="sq-s" x="52" y="189.5" width="10" height="10" rx="3"/><rect class="skel" x="68" y="191.5" width="18" height="6" rx="3"/><rect class="lane-s cell" x="92.5" y="183" width="34" height="23" rx="8"/><rect class="skel" x="99" y="192.5" width="13" height="4" rx="2"/><rect class="lane-s cell" x="132.5" y="183" width="34" height="23" rx="8"/><rect class="skel" x="139" y="192.5" width="16" height="4" rx="2"/><rect class="lane-s cell" x="172.5" y="183" width="34" height="23" rx="8"/><rect class="skel" x="179" y="192.5" width="18" height="4" rx="2"/><rect class="lane-s cell" x="212.5" y="183" width="34" height="23" rx="8"/><rect class="skel" x="219" y="192.5" width="17" height="4" rx="2"/>
