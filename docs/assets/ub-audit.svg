    <rect class="sq-f" x="52" y="133.5" width="10" height="10" rx="3"/><rect class="skel" x="68" y="135.5" width="18" height="6" rx="3"/><rect class="lane-f cell" x="92.5" y="127" width="34" height="23" rx="8"/><rect class="skel" x="99" y="136.5" width="18" height="4" rx="2"/><rect class="lane-f cell" x="132.5" y="127" width="34" height="23" rx="8"/><rect class="skel" x="139" y="136.5" width="17" height="4" rx="2"/><rect class="lane-f cell" x="172.5" y="127" width="34" height="23" rx="8"/><rect class="skel" x="179" y="136.5" width="14" height="4" rx="2"/><rect class="lane-f cell" x="212.5" y="127" width="34" height="23" rx="8"/><rect class="skel" x="219" y="136.5" width="12" height="4" rx="2"/>
    <rect class="sq-b" x="52" y="161.5" width="10" height="10" rx="3"/><rect class="skel" x="68" y="163.5" width="18" height="6" rx="3"/><rect class="lane-b cell" x="92.5" y="155" width="34" height="23" rx="8"/><rect class="skel" x="99" y="164.5" width="16" height="4" rx="2"/><rect class="lane-b cell" x="132.5" y="155" width="34" height="23" rx="8"/><rect class="skel" x="139" y="164.5" width="18" height="4" rx="2"/><rect class="lane-b cell" x="172.5" y="155" width="34" height="23" rx="8"/><rect class="skel" x="179" y="164.5" width="17" height="4" rx="2"/><rect class="lane-b cell" x="212.5" y="155" width="34" height="23" rx="8"/><rect class="skel" x="219" y="164.5" width="14" height="4" rx="2"/>
    <rect class="sq-s" x="52" y="189.5" width="10" height="10" rx="3"/><rect class="skel" x="68" y="191.5" width="18" height="6" rx="3"/><rect class="lane-s cell" x="92.5" y="183" width="34" height="23" rx="8"/><rect class="skel" x="99" y="192.5" width="13" height="4" rx="2"/><rect class="lane-s cell" x="132.5" y="183" width="34" height="23" rx="8"/><rect class="skel" x="139" y="192.5" width="16" height="4" rx="2"/><rect class="lane-s cell" x="172.5" y="183" width="34" height="23" rx="8"/><rect class="skel" x="179" y="192.5" width="18" height="4" rx="2"/><rect class="lane-s cell" x="212.5" y="183" width="34" height="23" rx="8"/><rect class="skel" x="219" y="192.5" width="17" height="4" rx="2"/>
    <circle class="flag" cx="206.5" cy="99" r="5"/>
    <circle class="flag" cx="166.5" cy="127" r="5"/>
    <circle class="flag" cx="166.5" cy="155" r="5"/>
    <circle class="flag" cx="246.5" cy="183" r="5"/>
  <text class="label" x="52" y="250.5">Left exactly as it was</text>
  <path class="flow" d="M284.5,171.5 H312" marker-end="url(#headMuted)"/>
  <rect class="term" x="320.5" y="153" width="110" height="37" rx="8"/>
  <text class="term-key" x="375.5" y="176.5" text-anchor="middle">ub:audit</text>
  <path class="flow" d="M439,171.5 H466.5" marker-end="url(#headMuted)"/>
  <text class="label" x="476" y="50">Findings for you to triage</text>
  <rect class="card" x="476.5" y="68.5" width="379" height="206" rx="16"/>
    <rect class="cell-dash" x="500.5" y="100" width="34" height="23" rx="8"/>
    <circle class="flag" cx="534.5" cy="100" r="5"/>
  <text class="strong" x="552.5" y="108.5">No cell at this step</text>
  <text class="label" x="552.5" y="128.5">Open</text>
  <path class="rule" d="M500,141.5 H832"/>
    <rect class="lane-f cell" x="500.5" y="159.5" width="34" height="11" rx="4"/><rect class="skel" x="507" y="163" width="16" height="4" rx="2"/><rect class="lane-b cell" x="500.5" y="172.5" width="34" height="11" rx="4"/><rect class="skel" x="507" y="176" width="13" height="4" rx="2"/>
    <circle class="flag" cx="534.5" cy="160" r="5"/>
