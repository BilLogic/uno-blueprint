<svg viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg" font-family="'Ubuntu Sans', system-ui, sans-serif">
  <style>
    .plate { fill: #f6f8f7; }
    .dot { fill: #151a18; fill-opacity: 0.17; }
    .card { fill: #ffffff; stroke: #151a18; stroke-opacity: 0.09; }
    .card-dash { fill: #ffffff; stroke: #151a18; stroke-opacity: 0.34; stroke-dasharray: 4 4; }
    .card-focus { fill: #ffffff; stroke: #00806a; stroke-width: 1.5; }
    .title { font-size: 15px; font-weight: 600; fill: #151a18; }
    .label { font-size: 14.5px; fill: #565c5a; }
    .label-teal { font-size: 14.5px; font-weight: 600; fill: #00806a; }
    .strong { font-size: 14.5px; font-weight: 600; fill: #151a18; }
    .flow { stroke: #565c5a; stroke-width: 1.5; fill: none; }
    .flow-head { fill: #565c5a; }
    .trace { stroke: #00806a; stroke-width: 1.5; fill: none; }
    .trace-dash { stroke: #00806a; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
    .trace-head { fill: #00806a; }
    .skel { fill: #151a18; fill-opacity: 0.16; }
    .skel-teal { fill: #00806a; }
    .cell { stroke: #151a18; stroke-opacity: 0.09; }
    .cell-dash { fill: none; stroke: #151a18; stroke-opacity: 0.34; stroke-dasharray: 3 3; }
    .cell-focus { stroke: #00806a; stroke-opacity: 1; stroke-width: 1.5; }
    .cell-focus-dash { stroke: #00806a; stroke-opacity: 1; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .cell-stale { fill: #fff4e0; stroke: #b45309; stroke-width: 1.25; }
    .skel-stale { fill: #b45309; fill-opacity: 0.55; }
    .flag { fill: #00806a; stroke: #ffffff; stroke-width: 2; }
    .faded { opacity: 0.4; }
    .rule { stroke: #151a18; stroke-opacity: 0.09; }
    .tile { fill: #f6f8f7; stroke: #151a18; stroke-opacity: 0.09; }
    .glyph { fill: none; stroke: #565c5a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .raised { fill: #ffffff; stroke: #151a18; stroke-opacity: 0.17; }
    .term { fill: #101417; stroke: #101417; }
    .term-key { font-family: 'Ubuntu Sans Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; font-weight: 500; fill: #7fe3cc; }
    .lane-c { fill: #e8f3ed; } .sq-c { fill: #cfe6d9; }
    .lane-f { fill: #fdf1e3; } .sq-f { fill: #f6e0bd; }
    .lane-b { fill: #fbe9f0; } .sq-b { fill: #f2cfdf; }
    .lane-s { fill: #ecebf5; } .sq-s { fill: #d9d6ec; }
  </style>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle class="dot" cx="10" cy="10" r="0.8"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="70%">
      <stop offset="0.35" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="fadeMask"><rect width="880" height="300" fill="url(#fade)"/></mask>
    <marker id="headMuted" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="flow-head" d="M0,0.5 L7,4 L0,7.5 Z"/></marker>
    <marker id="headTeal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="trace-head" d="M0,0.5 L7,4 L0,7.5 Z"/></marker>
  </defs>
  <rect class="plate" width="880" height="300" rx="16"/>
  <rect width="880" height="300" rx="16" fill="url(#grid)" mask="url(#fadeMask)"/>
